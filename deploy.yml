name: Build & Deploy Nekutoon

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar data.js desde resources.yaml
        run: python generator.py

      - name: Confirmar cambios en data.js (si los hay)
        run: |
          git config user.name "nekutoon-bot"
          git config user.email "bot@nekutoon.local"
          git add data.js
          git diff --cached --quiet || git commit -m "chore: regenerar data.js automáticamente"
          git push || echo "Nada nuevo para subir"

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
